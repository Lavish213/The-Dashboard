name: One-time Zod security upgrade lockfile regeneration
on:
  push:
    branches: [security/zod4-lockfile-upgrade-20261025]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate package manifest and lockfile from registry
        working-directory: frontend
        run: npm install 'zod@^4.6.7' --save --package-lock-only --ignore-scripts --no-audit
      - name: Verify reproducible install
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Commit both files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m 'Upgrade Zod and regenerate reproducible lockfile'
          git push
